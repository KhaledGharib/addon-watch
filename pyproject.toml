[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "addon-watch"
dynamic = ["version"]
description = "A live-reload runner for Odoo addons: restarts the server on a change, upgrading only the modules that changed."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.8"
authors = [{ name = "Khaled Gharib" }]
keywords = ["odoo", "addons", "development", "watch", "reload", "autoreload", "hot-reload"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Build Tools",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage = "https://github.com/KhaledGharib/addon-watch"
Issues = "https://github.com/KhaledGharib/addon-watch/issues"

[project.scripts]
addon-watch = "addon_watch.cli:main"

[tool.hatch.version]
path = "src/addon_watch/__init__.py"

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "README.md", "LICENSE"]
